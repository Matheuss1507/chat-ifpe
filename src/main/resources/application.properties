spring.application.name=IfpeChat
server.port=8084
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_ifpe}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET:ChaveSecretaSuperSeguraParaOProjetoDeChatDoIFPE123456}